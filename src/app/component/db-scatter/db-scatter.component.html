<app-db-browser (selectedDataframe)="scatterDataHandler($event)"></app-db-browser>
@if (scatterData(); as data) {
  <div>
    <app-scatter-plot [data]="data" (heatmap)="handleHeatmap($event)"></app-scatter-plot>
    <div class="container mt-4">
      <button class="btn btn-primary" (click)="downloadSelectedData(data)">Download Data</button>
    </div>
  </div>
}
