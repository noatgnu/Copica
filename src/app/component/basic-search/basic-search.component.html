<div class="d-flex flex-row-reverse">

  @if (results().length > 0) {
    <div class="p-2">
      <button class="btn btn-secondary" [disabled]="results().length === 0" (click)="download()">Download</button>
    </div>
  }

  @if (results().length > 0) {
    <div class="p-2">
      <button class="btn btn-danger" [disabled]="results().length === 0" (click)="clear()">Clear</button>
    </div>
  }

  <div class="p-2">
    <button class="btn btn-primary" [disabled]="!loaded()" (click)="searchHandler()">Search</button>
  </div>
  <div class="p-2">
    <input
      [disabled]="!loaded()" id="searchProteinOrGene" type="text"
      class="form-control" [(ngModel)]="tableFilterModel"
      placeholder="{{loading()}}" [ngbTypeahead]="search">
  </div>
</div>
